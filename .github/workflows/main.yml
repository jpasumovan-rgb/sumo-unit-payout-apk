name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the app folder
        run: |
          if [ ! -d app ]; then
            for f in app__*; do p="${f//__//}"; mkdir -p "$(dirname "$p")"; mv "$f" "$p"; done
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk SUMO-Unit-Payout.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SUMO-Unit-Payout
          path: SUMO-Unit-Payout.apk
      - name: Publish download link (release "apk")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: SUMO Unit Payout (latest APK)
          body: "Latest build. Operators download SUMO-Unit-Payout.apk below."
          files: SUMO-Unit-Payout.apk
          make_latest: true
